# PulseNet in production: copied to /etc/nginx/conf.d/pulsenet.conf on the EC2.
#
#   https://app.pulsenet-services.com  the site: the React build, /api/ and /uploads/
#                                      proxied to gunicorn on 127.0.0.1:5000
#   http://app.pulsenet-services.com   the Let's Encrypt challenge, else a redirect
#   http://<IP>:8080                   the old address: a redirect to the domain
#
# The certificate comes from certbot with the webroot method (docs/aws_deployment.md,
# "HTTPS"); its renewal reloads nginx. The session cookie is Secure in production
# (SESSION_COOKIE_SECURE=1), so the site must not be served over plain HTTP.

server_tokens off;

server {
    listen 80 default_server;
    server_name app.pulsenet-services.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://app.pulsenet-services.com$request_uri;
    }
}

server {
    listen 8080 default_server;
    server_name _;

    return 301 https://app.pulsenet-services.com$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name app.pulsenet-services.com;

    ssl_certificate     /etc/letsencrypt/live/app.pulsenet-services.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.pulsenet-services.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:1m;
    ssl_session_timeout 1d;

    # A day of HSTS, only for this host (the domain's root is another site).
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /home/ec2-user/PulseNet/frontend/dist;
    index index.html;
    client_max_body_size 10M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
