# Used once, before the first certificate exists: pulsenet.conf names the
# certificate files, so nginx cannot load it until certbot has written them.
# Copy to /etc/nginx/conf.d/, reload nginx, run certbot, then replace this file
# with pulsenet.conf (docs/aws_deployment.md, "HTTPS").

server {
    listen 80 default_server;
    server_name app.pulsenet-services.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 404;
    }
}
