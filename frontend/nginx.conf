# nginx in the frontend container (frontend/Dockerfile): the same server block as
# on the EC2 (docs/aws_deployment_guide_frontend.md), with the backend container
# instead of 127.0.0.1. The page and the API share one origin, so the session
# cookie needs no CORS.
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10M;            # backend allows ~6MB uploads; nginx default 1MB would 413

    location / { try_files $uri $uri/ /index.html; }   # SPA routing

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
    }
}
