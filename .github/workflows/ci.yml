# Continuous integration: the same checks as `scripts/check.sh` (without --e2e),
# run on every push to main and on every pull request.
#
# - backend: unit + integration tests under coverage, then `coverage report`, which
#   fails below `fail_under` in backend/.coveragerc. Runs on Python 3.9 (the EC2
#   production runtime) and 3.13 (local development). The tests use the FakeConn
#   DB double, so no MySQL service is needed.
# - frontend: ESLint and the production build. The Cypress binary is not downloaded;
#   E2E is not run in CI yet.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (Python ${{ matrix.python-version }})
    # Pinned: setup-python has no Python 3.9 build for newer Ubuntu images.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit + integration tests
        run: python -m coverage run -m unittest discover tests

      - name: Coverage threshold
        run: python -m coverage report --skip-covered

  frontend:
    name: frontend (lint + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
